networks:
  bracket_lan:
    driver: bridge

volumes:
  bracket_pg_data:

services:
  postgres:
    image: postgres:16
    container_name: bracket-postgres
    environment:
      POSTGRES_DB: bracket_dev
      POSTGRES_USER: bracket_dev
      POSTGRES_PASSWORD: bracket_dev
    networks:
      - bracket_lan
    restart: unless-stopped
    volumes:
      - bracket_pg_data:/var/lib/postgresql/data

  bracket-backend:
    image: ghcr.io/evroon/bracket-backend
    container_name: bracket-backend
    depends_on:
      - postgres
    environment:
      ENVIRONMENT: DEVELOPMENT
      # CORS muss die Frontend-Origin sein (Browser-URL), also :3000
      CORS_ORIGINS: http://10.1.65.189:3000
      # Backend spricht Postgres über den Service-Namen im Docker-Netz
      PG_DSN: postgresql://bracket_dev:bracket_dev@postgres:5432/bracket_dev
    networks:
      - bracket_lan
    ports:
      - "8400:8400"
    restart: unless-stopped
    volumes:
      - ./backend/static:/app/static

  bracket-frontend:
    image: ghcr.io/evroon/bracket-frontend
    container_name: bracket-frontend
    environment:
      # Das ist die API-Base-URL, also Backend-Port :8400
      NEXT_PUBLIC_API_BASE_URL: http://10.1.65.189:8400
      # Test-Key (wie bei dir)
      NEXT_PUBLIC_HCAPTCHA_SITE_KEY: 10000000-ffff-ffff-ffff-000000000001
    networks:
      - bracket_lan
    ports:
      - "3000:3000"
    restart: unless-stopped
